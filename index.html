<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XX启动生成器</title>
<meta name="description" content="仿版号启动画面生成器：改标题、调星芒、导出 PNG。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23c9a45c' d='M50 2 Q56 44 62 50 Q56 56 50 98 Q44 56 38 50 Q44 44 50 2 Z'/%3E%3Cpath fill='%23c9a45c' d='M2 50 Q44 44 50 38 Q56 44 98 50 Q56 56 50 62 Q44 56 2 50 Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
@font-face{font-family:"Teyvat Black";src:url("/fonts/TeyvatBlack-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Inazuma Brush";src:url("/fonts/InazumaBrush-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Sumeru Scribe";src:url("/fonts/SumeruScribe-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Khaenriah Sun";src:url("/fonts/KhaenriahSun-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Khaenriah Sun Chasm";src:url("/fonts/KhaenriahSun-Chasm.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Deshret Inscription";src:url("/fonts/DeshretInscription-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Star Rail Neue Sans";src:url("/fonts/StarRailNeue-Sans-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Xianzhou Seal";src:url("/fonts/XianzhouSeal-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"ZZZ System";src:url("/fonts/ZZZSystem-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"ZZZ A";src:url("/fonts/ZZZA-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Endfield By Butan";src:url("/fonts/EndfieldByButan.ttf") format("truetype");font-weight:400;font-style:normal}
/* 单主题暗色控制台：画面本身是白纸，界面就得压暗，不然眼睛没法判断成品明度 */
:root{
  --ink:#12141a;
  --ink-2:#191c24;
  --ink-3:#20242e;
  --ink-4:#2a2f3b;
  --line:#2e3441;
  --line-2:#3c4351;
  --tx:#d8dbe3;
  --tx-2:#99a0af;
  --tx-3:#6b7280;
  --gold:#c9a45c;
  --gold-2:#e3c384;
  --gold-dim:#5a4a26;
  --sheet:#ffffff;
  --ui:"IBM Plex Sans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ink);
  color:var(--tx);
  font:400 13px/1.55 var(--ui);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* height 而不是 min-height：右侧控件栏很长，min-height 会把整页撑高、画面掉到折下 */
.shell{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;overflow:hidden}
/* ---- header ---- */
.bar{
  display:flex;align-items:center;gap:14px;
  padding:11px 18px;
  background:var(--ink-2);
  border-bottom:1px solid var(--line);
}
.mark{
  width:26px;height:26px;flex:none;
  color:var(--gold);
}
.brand h1{
  font:600 15px/1.2 var(--ui);
  letter-spacing:.04em;
}
.brand p{
  font:400 11px/1.3 var(--mono);
  color:var(--tx-3);
  letter-spacing:.06em;
  margin-top:2px;
}
.bar-spacer{flex:1}
.btn{
  padding:7px 14px;
  border:1px solid var(--line-2);
  border-radius:2px;
  background:var(--ink-3);
  font-size:12.5px;
  color:var(--tx);
  transition:border-color .12s,background .12s,color .12s;
}
.btn:hover{border-color:var(--gold-dim);background:var(--ink-4)}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.btn-primary{
  background:var(--gold);
  border-color:var(--gold);
  color:#20180a;
  font-weight:600;
}
.btn-primary:hover{background:var(--gold-2);border-color:var(--gold-2);color:#20180a}
.btn-ghost{background:transparent}
/* ---- main / stage ---- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:0}
.stage{
  display:flex;flex-direction:column;
  min-width:0;
  padding:26px 26px 0;
  background:radial-gradient(120% 90% at 50% 30%, #191c24 0%, #0e1015 100%);
}
.stage-inner{
  flex:1;display:flex;align-items:center;justify-content:center;
  min-height:0;
}
.proof{position:relative;max-width:100%;max-height:100%}
.proof canvas{
  display:block;
  max-width:100%;
  max-height:62vh;
  width:auto;height:auto;
  background:var(--sheet);
  box-shadow:0 18px 50px -14px rgba(0,0,0,.85);
  touch-action:none;
  cursor:default;
}
.proof.grab canvas{cursor:grab}
.proof.grabbing canvas{cursor:grabbing}
/* 四角的取景角标，纯装饰，暗示这是一张待印的样张 */
.tick{position:absolute;width:13px;height:13px;pointer-events:none;opacity:.55}
.tick::before,.tick::after{content:"";position:absolute;background:var(--gold)}
.tick::before{width:13px;height:1px}
.tick::after{width:1px;height:13px}
.tick.tl{top:-9px;left:-9px}
.tick.tr{top:-9px;right:-9px}
.tick.tr::before{right:0}.tick.tr::after{right:0}
.tick.bl{bottom:-9px;left:-9px}
.tick.bl::before{bottom:0}.tick.bl::after{bottom:0}
.tick.br{bottom:-9px;right:-9px}
.tick.br::before{bottom:0;right:0}.tick.br::after{bottom:0;right:0}
.stage-foot{
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding:16px 2px 18px;
  border-top:1px solid var(--line);
  margin-top:22px;
  font-size:11.5px;
}
.stage-foot .readout{color:var(--tx-2);letter-spacing:.04em}
.stage-foot .hint{color:var(--tx-3)}
/* ---- rail ---- */
.rail{
  background:var(--ink-2);
  border-left:1px solid var(--line);
  overflow-y:auto;
  min-height:0;
}
.grp{border-bottom:1px solid var(--line);padding:15px 18px 17px}
.grp:last-child{border-bottom:none}
.grp-hd{
  display:flex;align-items:baseline;gap:8px;
  margin-bottom:12px;
}
.grp-hd h2{
  font:600 10.5px var(--mono);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold);
}
.grp-hd h2 .cn{
  font-family:var(--ui);letter-spacing:.1em;text-transform:none;
}
.grp-hd .note{font-size:11px;color:var(--tx-3);margin-left:auto}
.stack{display:flex;flex-direction:column;gap:11px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{
  display:flex;align-items:baseline;gap:8px;
  font-size:11.5px;color:var(--tx-2);
}
.lbl .v{margin-left:auto;font:500 10.5px var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
input[type=text],textarea,select{
  width:100%;
  background:var(--ink-3);
  border:1px solid var(--line-2);
  border-radius:2px;
  color:var(--tx);
  font:400 12.5px/1.5 var(--ui);
  padding:6px 8px;
}
textarea{resize:vertical;min-height:44px}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--gold-dim)}
select{appearance:none;padding-right:24px;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx-3) 50%),linear-gradient(135deg,var(--tx-3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 8px) 13px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.title-in{font:900 17px/1.4 "Noto Serif SC",serif;letter-spacing:.06em;text-align:center}
/* ---- range ---- */
input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:16px;background:none;margin:0;cursor:ew-resize;
}
input[type=range]::-webkit-slider-runnable-track{
  height:2px;background:var(--line-2);border-radius:1px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:11px;height:11px;margin-top:-4.5px;
  background:var(--gold);border-radius:50%;border:none;
}
input[type=range]:hover::-webkit-slider-thumb{background:var(--gold-2)}
input[type=range]::-moz-range-track{height:2px;background:var(--line-2)}
input[type=range]::-moz-range-thumb{
  width:11px;height:11px;background:var(--gold);border:none;border-radius:50%;
}
/* ---- segmented ---- */
.seg{display:flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.seg button{
  flex:1;padding:5px 2px;
  /* 用界面字体而不是 mono：IBM Plex Mono 没有汉字，「星芒 A」会掉字形 */
  font:500 11.5px var(--ui);
  font-variant-numeric:tabular-nums;
  color:var(--tx-3);
  border-right:1px solid var(--line-2);
  transition:color .12s,background .12s;
}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed=true]{background:var(--gold);color:#20180a}
/* ---- color ---- */
.swatches{display:flex;gap:5px;margin-top:6px}
.swatches button{
  width:20px;height:20px;border-radius:2px;
  border:1px solid var(--line-2);
}
.swatches button:hover{border-color:var(--gold)}
input[type=color]{
  width:100%;height:28px;padding:0;
  border:1px solid var(--line-2);border-radius:2px;
  background:var(--ink-3);cursor:pointer;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:1px}
input[type=file]{
  width:100%;font:400 11px var(--mono);color:var(--tx-3);
}
input[type=file]::file-selector-button{
  margin-right:8px;padding:4px 9px;
  background:var(--ink-3);color:var(--tx-2);
  border:1px solid var(--line-2);border-radius:2px;
  font:400 11px var(--ui);cursor:pointer;
}
/* ---- preset chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{
  padding:5px 10px;
  border:1px solid var(--line-2);border-radius:2px;
  background:var(--ink-3);
  font-size:12px;color:var(--tx-2);
  transition:border-color .12s,color .12s;
}
.chips button:hover{border-color:var(--gold-dim);color:var(--tx)}
.chips button[aria-pressed=true]{border-color:var(--gold);color:var(--gold-2)}
/* ---- details ---- */
details summary{
  font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx-3);cursor:pointer;list-style:none;
}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";color:var(--gold)}
details[open] summary::before{content:"− "}
details summary:hover{color:var(--tx-2)}
details .stack{margin-top:10px}
/* ---- modal ---- */
.veil{
  position:fixed;inset:0;z-index:20;
  display:none;align-items:center;justify-content:center;
  padding:24px;
  background:rgba(6,7,10,.82);
}
.veil.on{display:flex}
.sheet{
  width:min(760px,100%);max-height:90vh;overflow:auto;
  background:var(--ink-2);
  border:1px solid var(--line-2);border-radius:3px;
  padding:20px;
}
.sheet-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-hd h2{font:600 13.5px var(--ui);letter-spacing:.04em}
.sheet-hd .status{margin-left:auto;font:400 11px var(--mono);color:var(--gold)}
.sheet img{
  display:block;width:100%;height:auto;
  border:1px solid var(--line-2);
  background:var(--sheet);
}
.sheet-ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.sheet-ft p{font-size:11.5px;color:var(--tx-3);flex:1;min-width:180px;line-height:1.5}
@media (max-width:880px){
  .main{grid-template-columns:minmax(0,1fr)}
  .shell{height:auto;overflow:visible}
  .rail{border-left:none;border-top:1px solid var(--line);overflow:visible}
  .stage{padding:18px 16px 0}
  .proof canvas{max-height:46vh}
  .brand p{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <path fill="currentColor" d="M50 2 Q56 44 62 50 Q56 56 50 98 Q44 56 38 50 Q44 44 50 2 Z"/>
      <path fill="currentColor" d="M2 50 Q44 44 50 38 Q56 44 98 50 Q56 56 50 62 Q44 56 2 50 Z"/>
    </svg>
    <div class="brand">
      <h1>XX启动</h1>
      <p>BANHAO SPLASH SCREEN GENERATOR</p>
    </div>
    <div class="bar-spacer"></div>
    <button class="btn btn-ghost" id="btn-reset" type="button">重置</button>
    <button class="btn btn-primary" id="btn-export" type="button">导出 PNG</button>
  </header>

  <div class="main">
    <section class="stage">
      <div class="stage-inner">
        <div class="proof" id="proof">
          <canvas id="cv" width="1920" height="1080"></canvas>
          <span class="tick tl"></span><span class="tick tr"></span>
          <span class="tick bl"></span><span class="tick br"></span>
        </div>
      </div>
      <div class="stage-foot">
        <span class="readout mono" id="readout">1920 × 1080</span>
        <span class="hint">在画面上直接拖动标题或星芒调整位置，点一下星芒即可选中它</span>
      </div>
    </section>
    <aside class="rail">
      <div class="grp">
        <div class="grp-hd"><h2>Preset <span class="cn">模板</span></h2></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="grp">
        <div class="grp-hd"><h2>Logotype <span class="cn">标题字</span></h2></div>
        <div class="stack">
          <div class="field">
            <label class="lbl" for="f-title">文字</label>
            <input type="text" id="f-title" class="title-in" maxlength="12" autocomplete="off">
          </div>
          <div class="field">
            <label class="lbl" for="f-font">字体</label>
            <select id="f-font"></select>
          </div>
          <div class="row">
            <div class="field">
              <label class="lbl" for="f-size">字号<span class="v" id="v-size"></span></label>
              <input type="range" id="f-size">
            </div>
            <div class="field">
              <label class="lbl" for="f-track">字距<span class="v" id="v-track"></span></label>
              <input type="range" id="f-track">
            </div>
          </div>
          <button class="btn" id="btn-center" type="button">标题回到画面中心</button>
        </div>
      </div>

      <div class="grp">
        <div class="grp-hd">
          <h2>Starburst <span class="cn">星芒</span></h2>
          <span class="note" id="star-note"></span>
        </div>
        <div class="stack">
          <div class="field">
            <span class="lbl">数量</span>
            <div class="seg" id="f-starcount"></div>
          </div>
          <div class="field" id="star-edit">
            <span class="lbl">正在编辑</span>
            <div class="seg" id="f-starsel"></div>
          </div>
          <div class="row" id="star-dims">
            <div class="field">
              <label class="lbl" for="f-starsize">长度<span class="v" id="v-starsize"></span></label>
              <input type="range" id="f-starsize">
            </div>
            <div class="field">
              <label class="lbl" for="f-staraspect">粗细<span class="v" id="v-staraspect"></span></label>
              <input type="range" id="f-staraspect">
            </div>
          </div>
          <div class="row" id="star-more">
            <div class="field">
              <label class="lbl" for="f-starrot">旋转<span class="v" id="v-starrot"></span></label>
              <input type="range" id="f-starrot">
            </div>
            <div class="field">
              <span class="lbl">对齐</span>
              <button class="btn" id="btn-snap" type="button">吸附到末字</button>
            </div>
          </div>
        </div>
      </div>

      <div class="grp">
        <div class="grp-hd"><h2>Licence block <span class="cn">版号信息</span></h2></div>
        <div class="stack">
          <div class="field">
            <label class="lbl" for="f-warn">健康游戏忠告</label>
            <textarea id="f-warn" rows="3" spellcheck="false"></textarea>
          </div>
          <div class="field">
            <label class="lbl" for="f-lines">信息行<span class="v">一行一条</span></label>
            <textarea id="f-lines" rows="5" spellcheck="false"></textarea>
          </div>
          <div class="row">
            <div class="field">
              <label class="lbl" for="f-infosize">字号<span class="v" id="v-infosize"></span></label>
              <input type="range" id="f-infosize">
            </div>
            <div class="field">
              <label class="lbl" for="f-gap">行距<span class="v" id="v-gap"></span></label>
              <input type="range" id="f-gap">
            </div>
          </div>
          <div class="field">
            <label class="lbl" for="f-bottom">下边距<span class="v" id="v-bottom"></span></label>
            <input type="range" id="f-bottom">
          </div>
        </div>
      </div>

      <div class="grp">
        <div class="grp-hd"><h2>Canvas <span class="cn">画面</span></h2></div>
        <div class="stack">
          <div class="field">
            <span class="lbl">比例</span>
            <div class="seg" id="f-ratio"></div>
          </div>
          <div class="row">
            <div class="field">
              <label class="lbl" for="f-bg">底色</label>
              <input type="color" id="f-bg">
              <div class="swatches" id="sw-bg"></div>
            </div>
            <div class="field">
              <label class="lbl" for="f-fg">墨色</label>
              <input type="color" id="f-fg">
              <div class="swatches" id="sw-fg"></div>
            </div>
          </div>
          <details>
            <summary>背景图</summary>
            <div class="stack">
              <input type="file" id="f-bgimg" accept="image/*">
              <div class="field">
                <label class="lbl" for="f-dim">底色蒙版<span class="v" id="v-dim"></span></label>
                <input type="range" id="f-dim">
              </div>
              <button class="btn" id="btn-clearimg" type="button">移除背景图</button>
            </div>
          </details>
        </div>
      </div>

      <div class="grp">
        <div class="grp-hd"><h2>Output <span class="cn">输出</span></h2></div>
        <div class="stack">
          <button class="btn btn-primary" id="btn-export-2" type="button">导出 PNG</button>
          <details>
            <summary>配置代码</summary>
            <div class="stack">
              <textarea id="f-json" rows="4" spellcheck="false"></textarea>
              <div class="row">
                <button class="btn" id="btn-json-read" type="button">读取当前配置</button>
                <button class="btn" id="btn-json-apply" type="button">应用这段配置</button>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="veil" id="veil">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ex-title">
    <div class="sheet-hd">
      <h2 id="ex-title">导出结果</h2>
      <span class="status mono" id="ex-status"></span>
    </div>
    <img id="ex-img" alt="生成的启动画面">
    <div class="sheet-ft">
      <p id="ex-note">若浏览器拦截了下载，在图片上右键选择「图片另存为」同样可以保存。</p>
      <button class="btn" id="btn-copy" type="button">复制到剪贴板</button>
      <a class="btn" id="btn-dl" download="qidong.png" href="#">下载图片</a>
      <button class="btn btn-primary" id="btn-close" type="button">完成</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
